import java.util.Properties

plugins {
    id 'java-library'
    id 'jacoco'
    id 'net.minecraftforge.gradle' version '7.0.40'
}

group = 'dev.chestwise'
version = rootProject.providers.gradleProperty('mod.version').get()

def repositoryRoot = rootProject.file('../..')
def generatedRoot = new File(repositoryRoot, 'versions/26.3-neoforge/build/generated/stonecutter/main/java')
def pins = new Properties()
    new File(repositoryRoot, 'versions/dependencies/26.3.properties').withInputStream(pins.&load)

base {
    archivesName = 'chestwise-forge-26.3'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'chestwise'
        }
        register('client') {
            mods { chestwise { source sourceSets.main } }
        }
        register('server') {
            args '--nogui'
            mods { chestwise { source sourceSets.main } }
        }
        register('gameTestServer') {
            mods { chestwise { source sourceSets.main } }
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    // JEI is compile-only; Forge 26.3 does not currently have a verified JEI runtime artifact.
    compileOnly "mezz.jei:jei-26.3-common-api:${pins.getProperty('jei_version')}"
    implementation minecraft.dependency("net.minecraftforge:forge:${pins.getProperty('forge_version')}")
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    main {
        java {
            srcDirs generatedRoot, project.file('src/main/java')
        }
        resources.srcDirs project.file('src/main/resources'), new File(repositoryRoot, 'src/main/resources')
    }
    test {
        java.srcDir new File(repositoryRoot, 'src/test/java')
    }
}

tasks.named('compileJava') {
    dependsOn ':26.3-neoforge:stonecutterGenerate'
    source = files(
        fileTree(generatedRoot) {
            exclude 'dev/chestwise/Chestwise.java'
            exclude 'dev/chestwise/minecraft/ChestwiseContent.java'
            exclude 'dev/chestwise/minecraft/LoadedContainerDiscovery.java'
            exclude 'dev/chestwise/platform/ChestwiseNetworking.java'
            exclude 'dev/chestwise/fabric/**'
            exclude 'dev/chestwise/neoforge/**'
            exclude 'dev/chestwise/forge/**'
            exclude 'dev/chestwise/compat/rei/**'
        },
        fileTree(project.file('src/main/java'))
    )
}

tasks.named('sourcesJar') {
    dependsOn ':26.3-neoforge:stonecutterGenerate'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    eachFile { details ->
        def generated = generatedRoot.toPath()
        def file = details.file.toPath()
        if (file.startsWith(generated) && (
            details.path == 'dev/chestwise/Chestwise.java' ||
            details.path == 'dev/chestwise/minecraft/ChestwiseContent.java' ||
            details.path == 'dev/chestwise/minecraft/LoadedContainerDiscovery.java' ||
            details.path == 'dev/chestwise/platform/ChestwiseNetworking.java' ||
            details.path.startsWith('dev/chestwise/fabric/') ||
            details.path.startsWith('dev/chestwise/neoforge/') ||
            details.path.startsWith('dev/chestwise/forge/')
        )) {
            details.exclude()
        }
    }
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'fabric.mod.json', 'META-INF/neoforge.mods.toml'
    doLast {
        def output = destinationDir
        new File(output, 'pack.mcmeta').text = '''{
  "pack": {
    "description": "Chestwise resources",
    "min_format": 97,
    "max_format": 121
  }
}
'''
        new File(output, 'data/chestwise/recipe/storage_terminal.json').text = '''{
  "type": "minecraft:crafting_shaped",
  "pattern": [
    "IPI",
    "RCR",
    "IPI"
  ],
  "key": {
    "I": "minecraft:iron_ingot",
    "P": "minecraft:glass_pane",
    "R": "minecraft:redstone",
    "C": "minecraft:crafting_table"
  },
  "result": {
    "id": "chestwise:storage_terminal",
    "count": 1
  }
}
'''
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    finalizedBy tasks.jacocoTestReport
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll '-Xlint:all', '-Werror'
}

jar {
    manifest.attributes([
        'Specification-Title': 'Chestwise',
        'Specification-Version': project.version,
        'Implementation-Title': 'Chestwise Forge 26.3',
        'Implementation-Version': project.version
    ])
}
