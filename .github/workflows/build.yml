name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-script-tests:
    name: Smoke and release-script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test bounded download retries
        run: python3 -m unittest scripts.test_download_utils scripts.test_publish_release

  artifacts:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # Stonecutter configures all Minecraft nodes in one Gradle invocation;
          # run Gradle on 25 while per-node Java toolchains target each game line.
          - name: Fabric 1.20.1
            task: ":1.20.1-fabric:build"
            java: 25
            jar: versions/1.20.1-fabric/build/libs/chestwise-fabric-1.20.1-0.1.0.jar
          - name: Forge 1.20.1
            task: ":1.20.1-forge:build"
            java: 25
            jar: versions/1.20.1-forge/build/libs/chestwise-forge-1.20.1-0.1.0.jar
          - name: NeoForge 1.20.1
            task: ":legacy-neoforge-1.20.1:build"
            java: 25
            jar: platforms/legacy-neoforge-1.20.1/build/libs/chestwise-neoforge-1.20.1-0.1.0.jar
          - name: Fabric 1.21.1
            task: ":1.21.1-fabric:build"
            java: 25
            jar: versions/1.21.1-fabric/build/libs/chestwise-fabric-1.21.1-0.1.0.jar
          - name: Forge 1.21.1
            task: ":1.21.1-forge:build"
            java: 25
            jar: versions/1.21.1-forge/build/libs/chestwise-forge-1.21.1-0.1.0.jar
          - name: NeoForge 1.21.1
            task: ":1.21.1-neoforge:build"
            java: 25
            jar: versions/1.21.1-neoforge/build/libs/chestwise-neoforge-1.21.1-0.1.0.jar
          - name: Fabric 26.3
            task: "-p platforms/modern-26.3 :26.3-fabric:build"
            java: 25
            jar: versions/26.3-fabric/build/libs/chestwise-fabric-26.3-0.1.0.jar
          - name: Forge 26.3
            task: "-p platforms/modern-26.3 :forge-26.3:build"
            java: 25
            jar: platforms/forge-26.3/build/libs/chestwise-forge-26.3-0.1.0.jar
          - name: NeoForge 26.3
            task: "-p platforms/modern-26.3 :26.3-neoforge:build"
            java: 25
            jar: versions/26.3-neoforge/build/libs/chestwise-neoforge-26.3-0.1.0.jar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and run unit tests
        run: ./gradlew ${{ matrix.task }} --stacktrace
      - name: Upload packaged mod
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.jar }}
          if-no-files-found: error

  fabric-game-tests:
    name: Fabric game tests ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.20.1
            java: 25
            task: ":1.20.1-fabric:runGameTestServer"
          - minecraft: 1.21.1
            java: 25
            task: ":1.21.1-fabric:runGameTestServer"
          - minecraft: 26.3
            java: 25
            task: "-p platforms/modern-26.3 :26.3-fabric:runGameTestServer"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Run server game tests
        run: ./gradlew ${{ matrix.task }} --stacktrace

  quilt:
    name: Quilt ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.20.1
            java: 25
            runtime_java: 17
            fabric_api: 0.92.11+1.20.1
            quilt_loader: 0.30.0
            build_task: ":1.20.1-fabric:build"
            artifact: versions/1.20.1-fabric/build/libs/chestwise-fabric-1.20.1-0.1.0.jar
          - minecraft: 1.21.1
            java: 25
            runtime_java: 21
            fabric_api: 0.116.15+1.21.1
            quilt_loader: 0.30.0
            build_task: ":1.21.1-fabric:build"
            artifact: versions/1.21.1-fabric/build/libs/chestwise-fabric-1.21.1-0.1.0.jar
          - minecraft: 26.3
            java: 25
            runtime_java: 25
            fabric_api: 0.162.0+26.3
            quilt_loader: 0.30.1
            build_task: "-p platforms/modern-26.3 :26.3-fabric:build"
            artifact: versions/26.3-fabric/build/libs/chestwise-fabric-26.3-0.1.0.jar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Package Fabric artifact
        run: ./gradlew ${{ matrix.build_task }} --stacktrace
      - name: Set up Minecraft runtime Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.runtime_java }}
      - name: Boot packaged artifact on Quilt
        run: >-
          python3 scripts/quilt_smoke_test.py
          --minecraft ${{ matrix.minecraft }}
          --loader ${{ matrix.quilt_loader }}
          --fabric-api ${{ matrix.fabric_api }}
          --artifact ${{ matrix.artifact }}
