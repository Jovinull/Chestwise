name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Test bounded download retries
        run: python3 -m unittest scripts.test_download_utils scripts.test_publish_release
      - name: Build and test legacy variants
        run: >-
          ./gradlew
          :1.20.1-fabric:build :1.20.1-forge:build :legacy-neoforge-1.20.1:build
          :1.21.1-fabric:build :1.21.1-forge:build :1.21.1-neoforge:build
          --stacktrace
      - name: Build and test Minecraft 26.3 variants
        run: >-
          ./gradlew -p platforms/modern-26.3
          :26.3-fabric:build :forge-26.3:build :26.3-neoforge:build
          --stacktrace
      - name: Run Fabric game tests
        run: >-
          ./gradlew
          :1.20.1-fabric:runGameTestServer
          :1.21.1-fabric:runGameTestServer
          --stacktrace
      - name: Run Minecraft 26.3 Fabric game tests
        run: ./gradlew -p platforms/modern-26.3 :26.3-fabric:runGameTestServer --stacktrace
      - name: Audit and assemble release files
        run: python3 scripts/audit_artifacts.py
      - name: Validate public distribution mapping without uploading
        run: python3 scripts/publish_release.py --artifact-dir build/release --version 0.1.0
      - uses: actions/upload-artifact@v7
        with:
          name: chestwise-release
          path: build/release/*
          if-no-files-found: error

  loader-smoke:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { minecraft: 1.20.1, loader: fabric, loader_version: 0.19.5, java: 17, fabric_api: "--fabric-api 0.92.11+1.20.1" }
          - { minecraft: 1.20.1, loader: forge, loader_version: 1.20.1-47.4.23, java: 17, fabric_api: "" }
          - { minecraft: 1.20.1, loader: neoforge, loader_version: 1.20.1-47.1.106, java: 17, fabric_api: "" }
          - { minecraft: 1.21.1, loader: fabric, loader_version: 0.19.5, java: 21, fabric_api: "--fabric-api 0.116.15+1.21.1" }
          - { minecraft: 1.21.1, loader: forge, loader_version: 1.21.1-52.1.16, java: 21, fabric_api: "" }
          - { minecraft: 1.21.1, loader: neoforge, loader_version: 21.1.248, java: 21, fabric_api: "" }
          - { minecraft: 26.3, loader: fabric, loader_version: 0.19.5, java: 25, fabric_api: "--fabric-api 0.162.0+26.3" }
          - { minecraft: 26.3, loader: forge, loader_version: 26.3-66.0.13, java: 25, fabric_api: "" }
          - { minecraft: 26.3, loader: neoforge, loader_version: 26.3.0.92, java: 25, fabric_api: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v8
        with:
          name: chestwise-release
          path: build/release
      - name: Boot packaged artifact on official loader server
        run: >-
          python3 scripts/loader_smoke_test.py
          --minecraft ${{ matrix.minecraft }}
          --loader ${{ matrix.loader }}
          --loader-version ${{ matrix.loader_version }}
          --artifact build/release/chestwise-${{ matrix.loader }}-${{ matrix.minecraft }}-0.1.0.jar
          ${{ matrix.fabric_api }}

  quilt-smoke:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { minecraft: 1.20.1, java: 17, quilt_loader: 0.30.0, fabric_api: 0.92.11+1.20.1 }
          - { minecraft: 1.21.1, java: 21, quilt_loader: 0.30.0, fabric_api: 0.116.15+1.21.1 }
          - { minecraft: 26.3, java: 25, quilt_loader: 0.30.1, fabric_api: 0.162.0+26.3 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v8
        with:
          name: chestwise-release
          path: build/release
      - name: Boot packaged Fabric artifact on Quilt
        run: >-
          python3 scripts/quilt_smoke_test.py
          --minecraft ${{ matrix.minecraft }}
          --loader ${{ matrix.quilt_loader || '0.30.0' }}
          --fabric-api ${{ matrix.fabric_api }}
          --artifact build/release/chestwise-fabric-${{ matrix.minecraft }}-0.1.0.jar

  publish-platforms:
    needs: [package, loader-smoke, quilt-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.1.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: chestwise-release
          path: build/release
      - name: Stage platform files as drafts/manual releases
        env:
          CHESTWISE_MODRINTH_PROJECT_ID: ${{ vars.CHESTWISE_MODRINTH_PROJECT_ID }}
          CHESTWISE_CURSEFORGE_PROJECT_ID: ${{ vars.CHESTWISE_CURSEFORGE_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: python3 scripts/publish_release.py --artifact-dir build/release --version 0.1.0 --publish

  publish:
    needs: [package, loader-smoke, quilt-smoke, publish-platforms]
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.1.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: chestwise-release
          path: build/release
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" build/release/*
          --verify-tag
          --title "Chestwise 0.1.0 (Beta)"
          --notes-file docs/release-notes-0.1.0.md
          --prerelease
          --repo "${GITHUB_REPOSITORY}"
